name: property-portal

# The app's Postgres for development: `bun run db:up` starts it and `bun run db:down` stops it. The `pgdata` volume
# keeps the data; `docker compose down -v` removes it. Port 55435 avoids a local Postgres on 5432 and the other Protobase templates (starter 55432, erp 55433, property-management 55434).
services:
  postgres:
    image: postgres:18
    ports:
      - '55435:5432'
    environment:
      POSTGRES_USER: protobase
      POSTGRES_PASSWORD: protobase
      POSTGRES_DB: property_portal
    shm_size: 1gb
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U protobase -d property_portal']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
